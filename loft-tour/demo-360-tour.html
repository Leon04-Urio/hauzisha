<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOFT³ 360° Tour Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.8;
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .section-title i {
            color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cube"></i> LOFT³ 360° Tour Creator</h1>
            <p>Upload your 360° panorama images and create immersive virtual tours</p>
        </div>
        
        <!-- Upload Section -->
        <div class="upload-section">
            <h2 class="section-title">
                <i class="fas fa-cloud-upload-alt"></i>
                Upload 360° Panorama Images
            </h2>
            
            <div id="upload-content">
                <!-- Upload interface will be added here -->
            </div>
        </div>
    </div>
</body>
</html>    <!-- Loa
d Marzipano library -->
    <script src="lib/marzipano.min.js"></script>
    
    <script>
        // Simple 360° tour implementation
        class Simple360Tour {
            constructor() {
                this.uploadedImages = [];
                this.currentImageIndex = 0;
                this.viewer = null;
                this.scenes = [];
                
                this.init();
            }
            
            init() {
                this.createUploadInterface();
                this.setupEventListeners();
            }
            
            createUploadInterface() {
                const uploadContent = document.getElementById('upload-content');
                uploadContent.innerHTML = `
                    <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                        <div class="upload-icon">
                            <i class="fas fa-images"></i>
                        </div>
                        <div class="upload-text">
                            <h3>Drag & Drop Your 360° Images</h3>
                            <p>Or click to browse files. Supports JPG, PNG (Equirectangular format)</p>
                            <button class="upload-btn" type="button">
                                <i class="fas fa-plus"></i> Choose Files
                            </button>
                        </div>
                    </div>
                    
                    <input type="file" id="file-input" class="file-input" multiple accept="image/*">
                    
                    <div class="preview-grid" id="preview-grid"></div>
                    
                    <div class="create-tour-section" style="text-align: center; margin-top: 30px;">
                        <button class="create-btn" id="create-btn" onclick="tour.createTour()" disabled>
                            <i class="fas fa-magic"></i>
                            Create 360° Virtual Tour
                        </button>
                    </div>
                    
                    <div class="tour-viewer" id="tour-viewer" style="display: none;">
                        <h3 style="margin: 30px 0 20px 0; text-align: center;">
                            <i class="fas fa-eye"></i> Your 360° Virtual Tour
                        </h3>
                        <div class="viewer-container" id="viewer-container" style="width: 100%; height: 500px; background: #000; border-radius: 15px; position: relative;"></div>
                        
                        <div class="tour-controls" style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; padding: 20px; background: rgba(0, 0, 0, 0.3); border-radius: 15px;">
                            <button class="control-btn" id="prev-btn" onclick="tour.previousImage()" disabled>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            
                            <div class="tour-info" style="text-align: center; min-width: 200px;">
                                <div class="current-image" id="current-image" style="font-size: 16px; font-weight: 600; margin-bottom: 5px;">Image 1</div>
                                <div class="image-progress" id="image-progress" style="font-size: 12px; opacity: 0.7;">1 of 1</div>
                            </div>
                            
                            <button class="control-btn" id="next-btn" onclick="tour.nextImage()">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                // Add styles
                const style = document.createElement('style');
                style.textContent = `
                    .upload-area {
                        border: 2px dashed rgba(212, 175, 55, 0.5);
                        border-radius: 15px;
                        padding: 60px 40px;
                        text-align: center;
                        cursor: pointer;
                        transition: all 0.3s ease;
                        background: rgba(212, 175, 55, 0.05);
                    }
                    
                    .upload-area:hover {
                        border-color: #d4af37;
                        background: rgba(212, 175, 55, 0.1);
                        transform: translateY(-2px);
                    }
                    
                    .upload-icon {
                        font-size: 48px;
                        color: #d4af37;
                        margin-bottom: 20px;
                    }
                    
                    .upload-text h3 {
                        font-size: 20px;
                        margin-bottom: 8px;
                    }
                    
                    .upload-text p {
                        opacity: 0.7;
                        margin-bottom: 20px;
                    }
                    
                    .upload-btn {
                        background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
                        color: #1a1a1a;
                        border: none;
                        padding: 12px 30px;
                        border-radius: 25px;
                        font-weight: 600;
                        cursor: pointer;
                        transition: all 0.2s ease;
                    }
                    
                    .upload-btn:hover {
                        transform: translateY(-2px);
                        box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
                    }
                    
                    .file-input {
                        display: none;
                    }
                    
                    .preview-grid {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                        gap: 20px;
                        margin-top: 30px;
                    }
                    
                    .preview-item {
                        background: rgba(255, 255, 255, 0.05);
                        border-radius: 12px;
                        overflow: hidden;
                        border: 1px solid rgba(255, 255, 255, 0.1);
                        transition: all 0.3s ease;
                        position: relative;
                    }
                    
                    .preview-item:hover {
                        transform: translateY(-5px);
                        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                    }
                    
                    .preview-image {
                        width: 100%;
                        height: 120px;
                        object-fit: cover;
                        background: #333;
                    }
                    
                    .preview-info {
                        padding: 15px;
                    }
                    
                    .preview-name {
                        font-size: 14px;
                        font-weight: 500;
                        margin-bottom: 5px;
                        white-space: nowrap;
                        overflow: hidden;
                        text-overflow: ellipsis;
                    }
                    
                    .preview-size {
                        font-size: 12px;
                        opacity: 0.6;
                    }
                    
                    .remove-btn {
                        position: absolute;
                        top: 10px;
                        right: 10px;
                        background: rgba(239, 68, 68, 0.8);
                        color: white;
                        border: none;
                        width: 24px;
                        height: 24px;
                        border-radius: 50%;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 12px;
                        transition: all 0.2s ease;
                    }
                    
                    .remove-btn:hover {
                        background: #ef4444;
                        transform: scale(1.1);
                    }
                    
                    .create-btn {
                        background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
                        color: white;
                        border: none;
                        padding: 15px 40px;
                        border-radius: 30px;
                        font-size: 18px;
                        font-weight: 600;
                        cursor: pointer;
                        transition: all 0.3s ease;
                        display: inline-flex;
                        align-items: center;
                        gap: 12px;
                    }
                    
                    .create-btn:hover:not(:disabled) {
                        transform: translateY(-3px);
                        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
                    }
                    
                    .create-btn:disabled {
                        opacity: 0.5;
                        cursor: not-allowed;
                    }
                    
                    .control-btn {
                        background: rgba(255, 255, 255, 0.1);
                        border: 1px solid rgba(255, 255, 255, 0.2);
                        color: white;
                        width: 50px;
                        height: 50px;
                        border-radius: 50%;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        transition: all 0.2s ease;
                        font-size: 18px;
                    }
                    
                    .control-btn:hover:not(:disabled) {
                        background: #d4af37;
                        transform: scale(1.1);
                    }
                    
                    .control-btn:disabled {
                        opacity: 0.3;
                        cursor: not-allowed;
                    }
                `;
                document.head.appendChild(style);
            }
            
            setupEventListeners() {
                const uploadArea = document.getElementById('upload-area');
                const fileInput = document.getElementById('file-input');
                
                // Drag and drop events
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.style.borderColor = '#d4af37';
                    uploadArea.style.background = 'rgba(212, 175, 55, 0.15)';
                });
                
                uploadArea.addEventListener('dragleave', () => {
                    uploadArea.style.borderColor = 'rgba(212, 175, 55, 0.5)';
                    uploadArea.style.background = 'rgba(212, 175, 55, 0.05)';
                });
                
                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.style.borderColor = 'rgba(212, 175, 55, 0.5)';
                    uploadArea.style.background = 'rgba(212, 175, 55, 0.05)';
                    this.handleFiles(e.dataTransfer.files);
                });
                
                fileInput.addEventListener('change', (e) => {
                    this.handleFiles(e.target.files);
                });
            }
            
            handleFiles(files) {
                Array.from(files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        this.addImageToPreview(file);
                    }
                });
                this.updateCreateButton();
            }
            
            addImageToPreview(file) {
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const imageData = {
                        file: file,
                        url: e.target.result,
                        name: file.name,
                        size: this.formatFileSize(file.size)
                    };
                    
                    this.uploadedImages.push(imageData);
                    this.refreshPreviewGrid();
                    this.updateCreateButton();
                };
                
                reader.readAsDataURL(file);
            }
            
            refreshPreviewGrid() {
                const previewGrid = document.getElementById('preview-grid');
                previewGrid.innerHTML = '';
                
                this.uploadedImages.forEach((imageData, index) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <img src="${imageData.url}" alt="${imageData.name}" class="preview-image">
                        <div class="preview-info">
                            <div class="preview-name">${imageData.name}</div>
                            <div class="preview-size">${imageData.size}</div>
                        </div>
                        <button class="remove-btn" onclick="tour.removeImage(${index})">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    previewGrid.appendChild(previewItem);
                });
            }
            
            removeImage(index) {
                this.uploadedImages.splice(index, 1);
                this.refreshPreviewGrid();
                this.updateCreateButton();
            }
            
            updateCreateButton() {
                const createBtn = document.getElementById('create-btn');
                createBtn.disabled = this.uploadedImages.length === 0;
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }
            
            async createTour() {
                if (this.uploadedImages.length === 0) return;
                
                try {
                    // Show tour viewer
                    document.getElementById('tour-viewer').style.display = 'block';
                    
                    // Initialize Marzipano viewer
                    await this.initializeViewer();
                    
                    // Load first image
                    this.loadImage(0);
                    
                    // Scroll to viewer
                    document.getElementById('tour-viewer').scrollIntoView({ 
                        behavior: 'smooth' 
                    });
                    
                } catch (error) {
                    console.error('Failed to create tour:', error);
                    alert('Failed to create tour: ' + error.message);
                }
            }
            
            async initializeViewer() {
                const container = document.getElementById('viewer-container');
                
                // Check if Marzipano is loaded
                if (typeof Marzipano === 'undefined') {
                    throw new Error('Marzipano library not loaded');
                }
                
                // Create Marzipano viewer
                this.viewer = new Marzipano.Viewer(container, {
                    controls: {
                        mouseViewMode: 'drag'
                    }
                });
                
                console.log('360° viewer initialized successfully');
            }
            
            loadImage(index) {
                if (index < 0 || index >= this.uploadedImages.length) return;
                
                this.currentImageIndex = index;
                const imageData = this.uploadedImages[index];
                
                try {
                    // Create image source
                    const source = Marzipano.ImageUrlSource.fromString(imageData.url);
                    
                    // Create geometry for equirectangular panorama
                    const geometry = new Marzipano.EquirectGeometry([{ width: 4096 }]);
                    
                    // Create view with limits
                    const limiter = Marzipano.RectilinearView.limit.traditional(4096, 120 * Math.PI / 180, 60 * Math.PI / 180);
                    const view = new Marzipano.RectilinearView(
                        { yaw: 0, pitch: 0, fov: 75 * Math.PI / 180 },
                        limiter
                    );
                    
                    // Create scene
                    const scene = this.viewer.createScene({
                        source: source,
                        geometry: geometry,
                        view: view,
                        pinFirstLevel: true
                    });
                    
                    // Switch to scene
                    scene.switchTo({ transitionDuration: 1000 });
                    
                    // Update UI
                    this.updateTourInfo();
                    
                    console.log(`Loaded 360° image: ${imageData.name}`);
                    
                } catch (error) {
                    console.error('Failed to load 360° image:', error);
                }
            }
            
            updateTourInfo() {
                const imageData = this.uploadedImages[this.currentImageIndex];
                
                document.getElementById('current-image').textContent = imageData.name;
                document.getElementById('image-progress').textContent = `${this.currentImageIndex + 1} of ${this.uploadedImages.length}`;
                
                // Update navigation buttons
                document.getElementById('prev-btn').disabled = this.currentImageIndex === 0;
                document.getElementById('next-btn').disabled = this.currentImageIndex === this.uploadedImages.length - 1;
            }
            
            previousImage() {
                if (this.currentImageIndex > 0) {
                    this.loadImage(this.currentImageIndex - 1);
                }
            }
            
            nextImage() {
                if (this.currentImageIndex < this.uploadedImages.length - 1) {
                    this.loadImage(this.currentImageIndex + 1);
                }
            }
        }
        
        // Initialize tour
        let tour;
        
        document.addEventListener('DOMContentLoaded', () => {
            tour = new Simple360Tour();
            console.log('LOFT³ 360° Tour Demo initialized');
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('tour-viewer').style.display === 'block') {
                switch (e.key) {
                    case 'ArrowLeft':
                        tour.previousImage();
                        break;
                    case 'ArrowRight':
                        tour.nextImage();
                        break;
                }
            }
        });
    </script>
</body>
</html>
